<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatAze — Oyunçuları tap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d14; --bg2:#10131d; --card:#151a27; --card2:#1b2132; --line:#242b3f;
  --text:#eef1f8; --muted:#8c95ad; --accent:#7c5cff; --accent2:#4f8bff;
  --ok:#2ecc8f; --danger:#ff5d73; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Layout ---------- */
#app{height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(11,13,20,.85);backdrop-filter:blur(12px);flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:18px}
.userbox{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:0 0 auto}
.uname{font-weight:600;font-size:14px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-ghost{padding:8px 14px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
.btn-ghost:hover{color:var(--text);border-color:#3a4363}

/* ---------- Home ---------- */
#home{flex:1;overflow-y:auto}
.container{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
.hero h1{font-size:clamp(26px,4.5vw,38px);font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--muted);margin-top:6px;font-size:15px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 20px}
.cat{padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);transition:.15s;display:flex;align-items:center;gap:7px}
.cat:hover{color:var(--text);border-color:#3a4363}
.cat.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(124,92,255,.35)}
.cat .count{font-size:12px;opacity:.75;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.game{position:relative;text-align:left;padding:18px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:14px;min-height:150px}
.game::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,var(--g1),transparent 60%);opacity:.22;transition:.2s;pointer-events:none}
.game:hover{transform:translateY(-3px);border-color:#3a4363;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.game:hover::before{opacity:.38}
.game-ico{position:relative;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 8px 18px rgba(0,0,0,.35)}
.game-name{position:relative;font-weight:700;font-size:17px;letter-spacing:-.01em}
.game-meta{position:relative;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.enter{color:var(--text);font-weight:600;display:flex;align-items:center;gap:4px}
.empty{color:var(--muted);text-align:center;padding:40px 0}

/* ---------- Chat ---------- */
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg2);flex:0 0 auto}
.back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;transition:.15s}
.back:hover{border-color:#3a4363}
.chat-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.chat-title{font-weight:700;font-size:16px;line-height:1.2}
.chat-sub{font-size:12px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
.msgs-inner{width:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:10px;align-items:flex-end;margin-top:10px}
.row.same{margin-top:0}
.row.me{flex-direction:row-reverse}
.row .avatar{width:32px;height:32px;font-size:13px}
.row.same .avatar{visibility:hidden}
.bubble-wrap{max-width:min(78%,520px);display:flex;flex-direction:column;gap:3px}
.row.me .bubble-wrap{align-items:flex-end}
.who{font-size:12px;font-weight:700;margin-left:4px}
.bubble{padding:9px 13px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-size:15px;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;border-bottom-left-radius:5px}
.row.me .bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.time{font-size:11px;color:var(--muted);margin:0 6px}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:999px;margin:14px 0 4px}
.chat-empty{margin:auto;text-align:center;color:var(--muted);padding:30px}
.chat-empty .big{font-size:44px;margin-bottom:8px}
.composer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg2);flex:0 0 auto}
.composer-inner{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:center}
.composer input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;outline:none;font-size:15px;transition:.15s}
.composer input:focus{border-color:var(--accent)}
.send{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:18px;color:#fff;flex:0 0 auto;transition:.15s}
.send:hover{filter:brightness(1.1)}
.send:disabled{opacity:.45;cursor:default}

/* ---------- Auth ---------- */
#auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow-y:auto;background:radial-gradient(80% 60% at 20% 0%,rgba(124,92,255,.22),transparent 60%),radial-gradient(70% 60% at 100% 100%,rgba(79,139,255,.18),transparent 60%),var(--bg);z-index:10}
.auth-card{width:100%;max-width:410px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.auth-card .brand{justify-content:center;margin-bottom:6px;font-size:22px}
.auth-card .tag{text-align:center;color:var(--muted);font-size:14px;margin-bottom:22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:12px;padding:4px;margin-bottom:20px}
.tabs button{padding:10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);transition:.15s}
.tabs button.active{background:var(--card2);color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;font-size:15px;transition:.15s}
.field input:focus{border-color:var(--accent)}
.primary{width:100%;padding:14px;border-radius:12px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-top:6px;transition:.15s}
.primary:hover{filter:brightness(1.1)}
.primary:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);font-size:13px;margin-top:12px;text-align:center;min-height:18px}

/* ---------- Setup warning ---------- */
.setup{max-width:520px;text-align:center}
.setup h2{margin-bottom:10px}
.setup p{color:var(--muted);font-size:14px}
.setup code{background:var(--bg2);padding:2px 7px;border-radius:6px;color:var(--text);font-size:13px}

.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#2a3250;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

@media (max-width:560px){
  .topbar{padding:12px 14px}
  .uname{display:none}
  .container{padding:20px 14px 50px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .game{padding:14px;min-height:130px}
  .game-ico{width:44px;height:44px;font-size:22px}
  .game-name{font-size:15px}
  .bubble-wrap{max-width:84%}
}
</style>
</head>
<body>

<div id="boot" style="height:100dvh;display:grid;place-items:center"><div class="spinner"></div></div>

<!-- Auth -->
<div id="auth" class="hidden">
  <div class="auth-card">
    <div class="brand"><div class="brand-logo">🎮</div>ChatAze</div>
    <p class="tag">Oyunçuları tap, birlikdə oyna</p>
    <div class="tabs">
      <button id="tabLogin" class="active" type="button">Giriş</button>
      <button id="tabReg" type="button">Qeydiyyat</button>
    </div>
    <form id="authForm" novalidate>
      <div class="field hidden" id="fName">
        <label for="inName">İstifadəçi adı</label>
        <input id="inName" type="text" maxlength="20" autocomplete="nickname" placeholder="məs. Elvin_Pro">
      </div>
      <div class="field">
        <label for="inEmail">E-poçt</label>
        <input id="inEmail" type="email" autocomplete="email" placeholder="sen@example.com">
      </div>
      <div class="field">
        <label for="inPass">Şifrə</label>
        <input id="inPass" type="password" autocomplete="current-password" placeholder="Ən azı 6 simvol">
      </div>
      <button class="primary" id="authBtn" type="submit">Daxil ol</button>
      <div class="err" id="authErr"></div>
    </form>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><div class="brand-logo">🎮</div>ChatAze</div>
    <div class="userbox">
      <div class="avatar" id="meAvatar"></div>
      <span class="uname" id="meName"></span>
      <button class="btn-ghost" id="logout" type="button">Çıxış</button>
    </div>
  </header>

  <main id="home">
    <div class="container">
      <div class="hero">
        <h1>Oyununu seç 👇</h1>
        <p>Oyuna toxun, çat otağı açılsın. Orada oyunçuları tapıb birlikdə oynaya bilərsən.</p>
      </div>
      <div class="cats" id="cats"></div>
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <section id="chat" class="hidden">
    <div class="chat-head">
      <button class="back" id="back" type="button" aria-label="Geri">←</button>
      <div class="chat-ico" id="chatIco"></div>
      <div>
        <div class="chat-title" id="chatTitle"></div>
        <div class="chat-sub">Ümumi çat otağı</div>
      </div>
    </div>
    <div class="msgs" id="msgs"><div class="msgs-inner" id="msgsInner"></div></div>
    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-inner">
        <input id="msgInput" type="text" maxlength="500" placeholder="Mesaj yaz..." enterkeyhint="send">
        <button class="send" id="sendBtn" type="submit" aria-label="Göndər">➤</button>
      </div>
    </form>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ============================================================
   FIREBASE AÇARLARI — bura öz açarlarını yapışdır (SETUP.md-ə bax)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDTOSWmHMRk13RdA1kPsZEX96xapBQf-xI",
  authDomain: "chataze-46ce9.firebaseapp.com",
  projectId: "chataze-46ce9",
  storageBucket: "chataze-46ce9.firebasestorage.app",
  messagingSenderId: "469569192344",
  appId: "1:469569192344:web:8bc5cc09dd4729912f6bed"
};

/* ---------- Data ---------- */
const CATEGORIES = [
  { id:'all',    name:'Hamısı',          icon:'✨' },
  { id:'br',     name:'Battle Royale',   icon:'🪂' },
  { id:'shooter',name:'Şuter',           icon:'🎯' },
  { id:'sandbox',name:'Macəra',          icon:'🧭' },
  { id:'sport',  name:'Futbol',          icon:'⚽' },
];
const GAMES = [
  { id:'pubg-mobile', name:'PUBG Mobile',        cat:'br',     icon:'🪂', g1:'#f5a524', g2:'#d9480f' },
  { id:'fortnite',    name:'Fortnite',           cat:'br',     icon:'🏗️', g1:'#a855f7', g2:'#3b82f6' },
  { id:'valorant',    name:'Valorant',           cat:'shooter',icon:'🎯', g1:'#ff4655', g2:'#9f1239' },
  { id:'cs2',         name:'CS2',                cat:'shooter',icon:'💣', g1:'#f59e0b', g2:'#1d4ed8' },
  { id:'standoff2',   name:'Standoff 2',         cat:'shooter',icon:'🔫', g1:'#ef4444', g2:'#f59e0b' },
  { id:'codm',        name:'Call of Duty Mobile',cat:'shooter',icon:'🎖️', g1:'#84cc16', g2:'#14532d' },
  { id:'minecraft',   name:'Minecraft',          cat:'sandbox',icon:'⛏️', g1:'#22c55e', g2:'#92400e' },
  { id:'brawl-stars', name:'Brawl Stars',        cat:'sandbox',icon:'⭐', g1:'#facc15', g2:'#ea580c' },
  { id:'efootball',   name:'eFootball',          cat:'sport',  icon:'⚽', g1:'#3b82f6', g2:'#0e7490' },
  { id:'fifa',        name:'FIFA',               cat:'sport',  icon:'🏆', g1:'#10b981', g2:'#1e40af' },
];
const gameById = id => GAMES.find(g => g.id === id);

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const COLORS = ['#7c5cff','#4f8bff','#e8590c','#2f9e44','#d6336c','#0c8599','#f08c00','#9c36b5','#e03131','#1c7ed6'];
const colorFor = s => { let h=0; for (const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
const initial = n => (n||'?').trim().charAt(0).toUpperCase();
const pad = n => String(n).padStart(2,'0');
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const MONTHS = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avqust','sentyabr','oktyabr','noyabr','dekabr'];
function dayLabel(d){
  const t=new Date(), y=new Date(Date.now()-864e5);
  const same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(d,t)) return 'Bu gün';
  if(same(d,y)) return 'Dünən';
  return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function setAvatar(el,name,uid){ el.textContent=initial(name); el.style.background=colorFor(uid||name); }

/* ---------- Setup check ---------- */
if (firebaseConfig.apiKey.startsWith('BURA')) {
  $('boot').innerHTML = `<div class="auth-card setup"><h2>⚙️ Firebase açarları lazımdır</h2>
  <p><code>index.html</code> faylında <code>firebaseConfig</code> hissəsinə öz Firebase açarlarını yapışdır. Addımlar <code>SETUP.md</code> faylındadır.</p></div>`;
  throw new Error('Firebase config yoxdur');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------- Auth UI ---------- */
let mode = 'login';
function setMode(m){
  mode = m;
  $('tabLogin').classList.toggle('active', m==='login');
  $('tabReg').classList.toggle('active', m==='reg');
  $('fName').classList.toggle('hidden', m==='login');
  $('authBtn').textContent = m==='login' ? 'Daxil ol' : 'Hesab yarat';
  $('inPass').autocomplete = m==='login' ? 'current-password' : 'new-password';
  $('authErr').textContent = '';
}
$('tabLogin').onclick = () => setMode('login');
$('tabReg').onclick = () => setMode('reg');

const ERR = {
  'auth/invalid-email':'E-poçt ünvanı düzgün deyil.',
  'auth/missing-password':'Şifrəni yaz.',
  'auth/weak-password':'Şifrə ən azı 6 simvol olmalıdır.',
  'auth/email-already-in-use':'Bu e-poçt artıq qeydiyyatdan keçib.',
  'auth/invalid-credential':'E-poçt və ya şifrə səhvdir.',
  'auth/user-not-found':'Bu e-poçtla hesab tapılmadı.',
  'auth/wrong-password':'Şifrə səhvdir.',
  'auth/too-many-requests':'Çox cəhd oldu. Bir az sonra yenidən yoxla.',
  'auth/network-request-failed':'İnternet bağlantısını yoxla.',
  'auth/operation-not-allowed':'E-poçt/şifrə girişi Firebase-də aktiv edilməyib.'
};

$('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('inEmail').value.trim(), pass = $('inPass').value, name = $('inName').value.trim();
  const err = $('authErr'); err.textContent = '';
  if (mode==='reg') {
    if (name.length < 3) { err.textContent = 'İstifadəçi adı ən azı 3 simvol olmalıdır.'; return; }
    if (!/^[\p{L}\p{N}_.\- ]+$/u.test(name)) { err.textContent = 'Adda yalnız hərf, rəqəm, _ . - ola bilər.'; return; }
  }
  $('authBtn').disabled = true;
  try {
    if (mode==='reg') {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      showApp(cred.user);
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (ex) {
    err.textContent = ERR[ex.code] || 'Xəta baş verdi. Yenidən cəhd et.';
  } finally { $('authBtn').disabled = false; }
});

$('logout').onclick = () => signOut(auth);

/* ---------- Home ---------- */
let activeCat = 'all';
function renderCats(){
  $('cats').innerHTML = '';
  for (const c of CATEGORIES) {
    const n = c.id==='all' ? GAMES.length : GAMES.filter(g=>g.cat===c.id).length;
    const b = document.createElement('button');
    b.type='button'; b.className='cat'+(c.id===activeCat?' active':'');
    b.innerHTML = `<span>${c.icon}</span><span>${c.name}</span><span class="count">${n}</span>`;
    b.onclick = () => { activeCat=c.id; renderCats(); renderGames(); };
    $('cats').appendChild(b);
  }
}
function renderGames(){
  const list = activeCat==='all' ? GAMES : GAMES.filter(g=>g.cat===activeCat);
  const grid = $('grid'); grid.innerHTML='';
  if (!list.length) { grid.innerHTML='<div class="empty">Bu kateqoriyada oyun yoxdur.</div>'; return; }
  for (const g of list) {
    const b = document.createElement('button');
    b.type='button'; b.className='game';
    b.style.setProperty('--g1',g.g1); b.style.setProperty('--g2',g.g2);
    b.innerHTML = `<div class="game-ico">${g.icon}</div>
      <div class="game-name"></div>
      <div class="game-meta"><span>Çat otağı</span><span class="enter">Daxil ol →</span></div>`;
    b.querySelector('.game-name').textContent = g.name;
    b.onclick = () => { location.hash = '#/chat/'+g.id; };
    grid.appendChild(b);
  }
}

/* ---------- Chat ---------- */
let unsub = null, currentRoom = null, lastSend = 0;
function openChat(id){
  const g = gameById(id);
  if (!g) { location.hash = ''; return; }
  currentRoom = id;
  $('home').classList.add('hidden');
  $('chat').classList.remove('hidden');
  $('chatTitle').textContent = g.name;
  const ico = $('chatIco'); ico.textContent = g.icon;
  ico.style.background = `linear-gradient(135deg,${g.g1},${g.g2})`;
  const inner = $('msgsInner');
  inner.innerHTML = '<div class="spinner"></div>';
  if (unsub) unsub();
  const q = query(collection(db,'rooms',id,'messages'), orderBy('createdAt','desc'), limit(100));
  let first = true;
  unsub = onSnapshot(q, snap => {
    const msgs = snap.docs.map(d => ({ id:d.id, ...d.data() })).reverse();
    const nearBottom = first || (()=>{ const m=$('msgs'); return m.scrollHeight-m.scrollTop-m.clientHeight < 140; })();
    renderMessages(msgs);
    if (nearBottom) { const m=$('msgs'); m.style.scrollBehavior = first?'auto':'smooth'; m.scrollTop = m.scrollHeight; }
    first = false;
  }, () => {
    inner.innerHTML = '<div class="chat-empty"><div class="big">⚠️</div>Mesajlar yüklənmədi. Firestore qaydalarını yoxla.</div>';
  });
  setTimeout(()=>$('msgInput').focus(), 100);
}
function closeChat(){
  if (unsub) { unsub(); unsub=null; }
  currentRoom = null;
  $('chat').classList.add('hidden');
  $('home').classList.remove('hidden');
}
function renderMessages(msgs){
  const inner = $('msgsInner'); inner.innerHTML = '';
  if (!msgs.length) {
    inner.innerHTML = '<div class="chat-empty"><div class="big">👋</div><b>Hələ mesaj yoxdur</b><br>İlk mesajı sən yaz, oyunçuları çağır!</div>';
    return;
  }
  const me = auth.currentUser?.uid;
  let prevUid = null, prevDay = '', prevTime = 0;
  for (const m of msgs) {
    const d = m.createdAt?.toDate ? m.createdAt.toDate() : new Date();
    const dk = d.toDateString();
    if (dk !== prevDay) {
      const s = document.createElement('div'); s.className='day'; s.textContent = dayLabel(d);
      inner.appendChild(s); prevDay = dk; prevUid = null;
    }
    const same = prevUid === m.uid && (d.getTime()-prevTime) < 5*60*1000;
    const mine = m.uid === me;
    const row = document.createElement('div');
    row.className = 'row'+(mine?' me':'')+(same?' same':'');
    const av = document.createElement('div'); av.className='avatar'; setAvatar(av, m.name, m.uid);
    const wrap = document.createElement('div'); wrap.className='bubble-wrap';
    if (!same && !mine) {
      const w = document.createElement('div'); w.className='who'; w.textContent = m.name || 'İstifadəçi'; w.style.color = colorFor(m.uid);
      wrap.appendChild(w);
    }
    const b = document.createElement('div'); b.className='bubble'; b.textContent = m.text;
    const t = document.createElement('div'); t.className='time'; t.textContent = hhmm(d);
    wrap.appendChild(b); wrap.appendChild(t);
    row.appendChild(av); row.appendChild(wrap);
    inner.appendChild(row);
    prevUid = m.uid; prevTime = d.getTime();
  }
}
$('composer').addEventListener('submit', async e => {
  e.preventDefault();
  const input = $('msgInput');
  const text = input.value.trim();
  const user = auth.currentUser;
  if (!text || !user || !currentRoom) return;
  if (Date.now() - lastSend < 800) return; // spam qorunması
  lastSend = Date.now();
  input.value = '';
  try {
    await addDoc(collection(db,'rooms',currentRoom,'messages'), {
      uid: user.uid,
      name: user.displayName || 'İstifadəçi',
      text: text.slice(0,500),
      createdAt: serverTimestamp()
    });
  } catch (ex) {
    input.value = text;
    alert('Mesaj göndərilmədi. Bağlantını yoxla.');
  }
  input.focus();
});
$('back').onclick = () => { location.hash = ''; };

/* ---------- Routing ---------- */
function route(){
  const m = location.hash.match(/^#\/chat\/([\w-]+)$/);
  if (m && auth.currentUser) openChat(m[1]); else closeChat();
}
window.addEventListener('hashchange', route);

/* ---------- Session ---------- */
function showApp(user){
  $('boot').classList.add('hidden');
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  const name = user.displayName || user.email.split('@')[0];
  $('meName').textContent = name;
  setAvatar($('meAvatar'), name, user.uid);
  renderCats(); renderGames(); route();
}
onAuthStateChanged(auth, user => {
  if (user) { showApp(user); }
  else {
    closeChat();
    $('boot').classList.add('hidden');
    $('app').classList.add('hidden');
    $('auth').classList.remove('hidden');
    $('authForm').reset(); setMode('login');
  }
});
</script>
</body>
</html>
